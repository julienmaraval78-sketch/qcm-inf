<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulateur Examen QCM Rishuy - 20 Questions</title>
  <style>
    :root {
      --primary: #1b2a47;
      --accent: #0f4c81;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --border: #e2e8f0;
      --success: #27ae60;
      --error: #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 60px; }
    
    header { background: linear-gradient(135deg, #16243d 0%, #1b2a47 100%); color: white; padding: 30px 20px 20px; text-align: center; }
    header h1 { font-size: 2rem; margin-bottom: 6px; }
    header p { opacity: 0.85; margin-bottom: 25px; }

    .main-nav { display: flex; justify-content: center; gap: 10px; background: rgba(255,255,255,0.15); padding: 8px; border-radius: 12px; max-width: 900px; margin: 0 auto; backdrop-filter: blur(5px); }
    .nav-tab { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 8px; color: white; text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.2s; }
    .nav-tab:hover { background: rgba(255,255,255,0.2); }
    .nav-tab.active { background: white; color: #1b2a47; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }

    .container { max-width: 850px; margin: 30px auto 0; padding: 0 20px; }
    
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: white; padding: 15px 20px; border-radius: 8px; border: 1px solid var(--border); }
    .timer { font-weight: bold; color: #e67e22; font-size: 1.1rem; }

    .quiz-card { background: var(--card-bg); border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid var(--border); }
    .case-study { background: #f8fafc; border-left: 4px solid var(--accent); padding: 15px; margin-bottom: 20px; border-radius: 4px; font-style: italic; line-height: 1.5; color: #334155; }
    
    .question-text { font-size: 1.15rem; font-weight: bold; color: var(--primary); margin-bottom: 20px; line-height: 1.4; }

    .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
    .option-btn { padding: 14px 18px; border: 1.5px solid var(--border); border-radius: 8px; background: #fff; text-align: left; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; color: var(--text); line-height: 1.3; }
    .option-btn:hover { background: #f0f4f8; border-color: var(--accent); }
    .option-btn.selected { background: #eaf2f8; border-color: var(--accent); font-weight: bold; }

    .btn-action { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; float: right; font-size: 1rem; }
    .btn-action:hover { background: var(--accent); }

    /* Bilan de correction */
    .correction-item { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
    .correction-item.wrong-item { border-left: 5px solid var(--error); }
    .correction-item.correct-item { border-left: 5px solid var(--success); }
    
    .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: white; margin-bottom: 10px; }
    .badge-success { background: var(--success); }
    .badge-error { background: var(--error); }

    .exp-box { margin-top: 12px; padding: 12px; background: #f1f5f9; border-radius: 6px; font-size: 0.9rem; line-height: 1.4; color: #334155; }

    @media (max-width: 768px) { .main-nav { flex-direction: column; } }
  </style>
</head>
<body>

<header>
  <h1>EXAMEN QCM RISHUY - SIMULATEUR D'ÉTAT</h1>
  <p>20 questions tirées aléatoirement • Correction détaillée en fin de session</p>
  <nav class="main-nav">
    <a href="index.html" class="nav-tab">📄 Fiches de Révision</a>
    <a href="calculatrice.html" class="nav-tab">🧮 Calculette Posologies</a>
    <a href="dictionnaire.html" class="nav-tab">🗣️ Dictionnaire Hébreu</a>
    <a href="quiz.html" class="nav-tab active">🧠 Quiz d'Entraînement</a>
  </nav>
</header>

<div class="container">

  <div class="quiz-header" id="quizHeader">
    <span id="qCount" style="font-weight: bold; color: var(--primary);">Question 1 sur 20</span>
    <span class="timer" id="timer">⏱ Temps : 00:00</span>
  </div>

  <div class="quiz-card" id="quizCard">
    <div class="case-study" id="caseStudy">
      <strong>Cas Clinique :</strong> Chargement...
    </div>

    <div class="question-text" id="qText">Chargement de la question...</div>

    <div class="options" id="optionsBox"></div>

    <button class="btn-action" id="btnNext" onclick="recordAndNext()">Suivant →</button>
    <div style="clear:both;"></div>
  </div>

  <div id="correctionSection" style="display:none;"></div>

</div>

<script>
  // BANQUE GLOBALE DE QUESTIONS RISHUY
  const questionBank = [
    {
      case: "Une patiente de 32 ans, enceinte à 34 SA, arrive aux urgences avec TA à 165/110 mmHg, céphalées sévères et troubles visuels.",
      q: "Quelle est la priorité infirmière immédiate concernant la prise en charge médicamenteuse et la sécurité ?",
      options: ["Paracétamol PO", "Sulfate de Magnésium (MgSO4) IV sous surveillance réflexes/diurèse", "Diurétique de l'anse en position assise", "Césarienne d'urgence sans bilan"],
      correct: 1,
      exp: "La prééclampsie sévère nécessite l'administration immédiate de Sulfate de Magnésium (MgSO4) pour prévenir la crise d'éclampsie. La surveillance stricte comprend réflexes rotuliens, FR (>12/min) et diurèse (>30ml/h)."
    },
    {
      case: "Patient de 65 ans hospitalisé présentant une dyspnée aiguë, orthopnée stricte, râles crépitants pulmonaires et crachats mousseux rosés.",
      q: "Parmi les actions infirmières suivantes, laquelle devez-vous exécuter en PREMIER ?",
      options: ["Position allongée stricte à 0°", "Position assise jambes pendantes + oxygène haut débit", "Bolus de Potassium IV", "Envoyer le patient seul en radio"],
      correct: 1,
      exp: "Tableau d'OAP (Oedème Aigu du Poumon). La position assise jambes pendantes diminue le retour veineux (précharge) et réduit le travail cardiaque."
    },
    {
      case: "Préparation d'une transfusion de culot globulaire (PGR) venant d'arriver de la banque du sang.",
      q: "Quelle est l'étape d'identitovigilance obligatoire au lit du patient avant la perfusion ?",
      options: ["Double vérification de concordance identité/poche et contrôle ultime ABO au lit du patient", "Vérifier le groupe sanguin dans le dossier seulement", "Chauffer la poche au radiateur pendant 45 min", "Accélérer le débit à 60 gtt/min au début"],
      correct: 0,
      exp: "Le contrôle ultime au lit du patient (carte Beth-Vincent / test ultime ABO) est l'étape légale obligatoire pour prévenir une incompatibilité transfusionnelle ABO mortelle."
    },
    {
      case: "Nourrisson de 4 ans (poids : 16 kg) admis pour pyrexie à 39.2°C. Prescription de Paracétamol à 15 mg/kg par prise.",
      q: "Quelle est la dose exacte en milligrammes (mg) à administrer ?",
      options: ["160 mg", "240 mg", "400 mg", "500 mg"],
      correct: 1,
      exp: "Calcul : 16 kg × 15 mg/kg = 240 mg par prise."
    },
    {
      case: "Selon la loi sur les droits du patient ('Chok Zkhouyot HaChole'), une intervention médicale nécessite un consentement éclairé.",
      q: "Dans quelle situation le consentement éclairé écrit peut-il être outrepassé légalement ?",
      options: ["Si le patient ne parle pas hébreu", "Si la famille refuse alors que le patient est majeur", "En cas d'urgence vitale immédiate chez un patient inconscient", "Pour des raisons d'organisation du service"],
      correct: 2,
      exp: "En situation d'urgence vitale imminente et en l'absence de capacité d'expression du patient, les soins nécessaires au maintien de la vie sont délivrés sans délai."
    },
    {
      case: "Un patient sous héparine non fractionnée (HNF) IVSE présente des signes de saignement actif. Le bilan montre un TCA très allongé.",
      q: "Quel est l'antidote spécifique de l'Héparine à préparer d'urgence ?",
      options: ["Vitamine K", "Sulfate de Protamine", "N-Acétylcystéine", "Flumazénil"],
      correct: 1,
      exp: "Le Sulfate de Protamine est l'antidote spécifique qui neutralise immédiatement l'effet de l'héparine."
    },
    {
      case: "Un patient diabétique de type 1 est trouvé obnubilé, sueurs profondes, tremblements et glycémie capillaire à 0.42 g/L (2.3 mmol/L).",
      q: "Si le patient est incapable d'avaler, quelle est la prise en charge immédiate ?",
      options: ["Faire boire un jus de fruit", "Administrer du Glucagon SC/IM ou Glucosé 30% IV", "Administrer 5 unités d'insuline rapide", "Mettre en PLS sans rien faire"],
      correct: 1,
      exp: "En cas d'hypoglycémie sévère avec troubles de la conscience, le resucrage oral est proscrit (risque d'inhalation). On administre du Glucosé 30% IV ou du Glucagon."
    },
    {
      case: "Lors d'un pansement de voie centrale (PICC-line ou cathéter jugulaire), le soignant applique les règles d'asepsie stricte.",
      q: "Quelle complication grave et précoce cherche-t-on à éviter lors du changement de ligne ou de bouchon ?",
      options: ["L'embolie gazeuse", "L'hypotension orthostatique", "L'alcalose métabolique", "La rétention urinaire"],
      correct: 0,
      exp: "L'ouverture d'une voie centrale à l'air libre expose au risque majeur d'embolie gazeuse. Il faut toujours clamper la voie avant la manipulation."
    },
    {
      case: "Un patient schizophrène sous Neuroleptiques (Halopéridol) présente une hyperthermie à 40°C, une rigidité musculaire extrême 'en tuyau de poêle' et une instabilité tensionnelle.",
      q: "À quel syndrome grave faut-il penser immédiatement ?",
      options: ["Syndrome sérotoninergique", "Syndrome Malin des Neuroleptiques (SMN)", "Choc anaphylactique", "Crise de tétanie"],
      correct: 1,
      exp: "Le SMN est une urgence vitale sous neuroleptiques. Il associe hyperthermie, rigidité musculaire sévère et troubles neuro-végétatifs. Arrêt immédiat du traitement."
    },
    {
      case: "Un patient est admis aux urgences victimes de brûlures sur l'ensemble du thorax antérieur et tout le membre supérieur droit.",
      q: "Selon la règle des 9 de Wallace, quel est le pourcentage de surface corporelle brûlée (SCB) ?",
      options: ["18%", "27%", "36%", "45%"],
      correct: 1,
      exp: "Thorax antérieur = 18% (tronc antérieur = 18%), Membre supérieur droit entier = 9%. Total = 18 + 9 = 27%."
    },
    {
      case: "Un patient en post-opératoire immédiat sous analgésie par PCA de Morphine présente une fréquence respiratoire à 8 cycles/minute et un score de sédation à 3.",
      q: "Quelle est l'action infirmière prioritaire à entreprendre ?",
      options: ["Arrêter la PCA, stimuler le patient et administrer de la Naloxone (Narcan) sur ordre médical", "Augmenter le débit de la PCA pour calmer la douleur", "Mettre le patient en position Trendelenburg", "Donner du Paracétamol IV"],
      correct: 0,
      exp: "Devant une bradypnée (<10/min) sous morphine (dépression respiratoire), il faut stopper la PCA, stimuler et préparer l'antidote : la Naloxone (Narcan)."
    },
    {
      case: "Surveillance d'un nourrisson atteint de bronchiolite à VRS.",
      q: "Quel est le signe clinique précoce d'épuisement respiratoire chez le nourrisson ?",
      options: ["Tachycardie avec tirage intercostal et balancement thoraco-abdominal", "Bradycardie d'emblée sans effort", "Fièvre isolée à 38°C", "Eruption cutanée maculo-papuleuse"],
      correct: 0,
      exp: "La lutte respiratoire se traduit par la polypnée, le tirage et le balancement thoraco-abdominal. La survenue de pauses ou bradycardie signe l'épuisement imminent."
    },
    {
      case: "Un patient porteur d'un plâtre au membre inférieur se plaint d'une douleur intense, progressive, résistante aux antalgiques, avec paresthésies des orteils.",
      q: "Quelle complication devez-vous suspecter en urgence ?",
      options: ["Phlébite superficielle", "Syndrome de Loge (Compartment syndrome)", "Erysipèle", "Lumbago aigu"],
      correct: 1,
      exp: "Le syndrome de loge est une urgence chirurgicale (ischémie par hyperpression dans la loge musculaire sous plâtre). Le plâtre doit être fendu immédiatement."
    },
    {
      case: "Un patient de 70 ans présente une fibrillation auriculaire (FA) chronique traitée par AVK (Coumadine). Son INR de contrôle est à 6.5 sans saignement apparent.",
      q: "Quelle est la conduite à tenir infirmière ?",
      options: ["Administrer la dose habituelle de Coumadine", "Avertir le médecin, suspendre la prise et préparer l'administration de Vitamine K selon prescription", "Donner de l'Aspirine en complément", "Faire faire un effort physique au patient"],
      correct: 1,
      exp: "Un INR > 5 représente un surdosage important avec risque hémorragique élevé. La Vitamine K est l'antidote des AVK."
    },
    {
      case: "Prévention des escales chez un patient alité dépendant.",
      q: "Quelle est la fréquence recommandée pour le changement de position et la mobilisation du patient au lit ?",
      options: ["Toutes les 2 heures", "Toutes les 8 heures", "Une fois par jour", "Uniquement à la demande du patient"],
      correct: 0,
      exp: "Le retournement/changement de position toutes les 2 heures est le standard pour levée d'appui et prévention des ischémies cutanées."
    },
    {
      case: "Un patient insuffisant rénal chronique en hémodialyse porte une fistule artérioveineuse (FAV) au bras gauche.",
      q: "Quelle mesure de sécurité devez-vous appliquer impérativement sur le bras porteur de la FAV ?",
      options: ["Ne jamais prendre la tension artérielle ni effectuer de ponction veineuse sur ce bras", "Prendre la TA uniquement sur ce bras", "Mettre un pansement compressif permanent", "Masser le bras deux fois par jour"],
      correct: 0,
      exp: "Il est strictement interdit de prendre la TA, de faire une prise de sang ou de poser une perfusion sur le bras porteur d'une FAV afin d'éviter la thrombose du montat."
    },
    {
      case: "Lors d'un arrêt cardio-respiratoire chez l'adulte, vous débutez la réanimation cardio-pulmonaire (RCP).",
      q: "Quel est le rythme MNS standard compressions / insufflations chez l'adulte ?",
      options: ["15 compressions / 2 insufflations", "30 compressions / 2 insufflations", "5 compressions / 1 insufflation", "50 compressions / 5 insufflations"],
      correct: 1,
      exp: "Recommandations internationales de RCP de l'adulte : 30 compressions thoraciques pour 2 insufflations à une fréquence de 100-120 cpm."
    },
    {
      case: "Prise en charge d'un patient victime d'un AVC ischémique aigu éligible à la thrombolyse.",
      q: "Quel est le délai maximal (fenêtre thérapeutique) usuel pour administrer la thrombolyse IV à partir du début des symptômes ?",
      options: ["4 heures et demi (4.5h)", "12 heures", "24 heures", "48 heures"],
      correct: 0,
      exp: "La thrombolyse IV par rtPA doit être administrée idéalement dans les 4h30 suivant l'apparition du premier signe d'AVC ischémique."
    },
    {
      case: "Un patient polytraumatisé arrive au déchocage. L'évaluation initiale suit l'algorithme ABCDE.",
      q: "Que représente la lettre 'A' dans l'approche ABCDE ?",
      options: ["Airway (Voies aériennes et contrôle du rachis cervical)", "Breathing (Ventilation)", "Circulation", "Disability (Neurologie)"],
      correct: 0,
      exp: "A = Airway avec maintien de l'axe tête-cou-tronc (immobilisation cervicale)."
    },
    {
      case: "Un patient atteint de tuberculose pulmonaire active est hospitalisé.",
      q: "Quel type d'isolement et de protection respiratoire faut-il appliquer ?",
      options: ["Isolement Contact avec masque chirurgical", "Isolement Air avec masque FFP2 / N95 pour les soignants et chambre à pression négative", "Isolement Gouttelettes simple", "Aucun isolement nécessaire"],
      correct: 1,
      exp: "La tuberculose se transmet par voie aérienne (droplets nuclei). Isolement 'Air' obligatoire avec masque FFP2/N95 et pression négative."
    },
    {
      case: "Prescription : Administrer 1000 mL de G5% en 8 heures à l'aide d'un diffuseur par gravité standard (20 gouttes/mL).",
      q: "Quel est le débit en gouttes par minute ?",
      options: ["21 gtt/min", "42 gtt/min", "60 gtt/min", "83 gtt/min"],
      correct: 1,
      exp: "Formule : (1000 mL × 20) / (8h × 60 min) = 20000 / 480 = 41.66 => 42 gouttes / min."
    },
    {
      case: "Un patient sous traitement antihypertenseur par Inhibiteur de l'ECA (IEC - Ramipril) se plaint d'un effet secondaire très fréquent et gênant.",
      q: "Quel est cet effet secondaire classique des IEC ?",
      options: ["Une toux sèche irritante et quinteuse", "Une diarrhée profuse", "Une hypercholestérolémie", "Des saignements de nez"],
      correct: 0,
      exp: "La toux sèche persistante due à l'accumulation de bradykinine est l'effet indésirable caractéristique des IEC, imposant souvent le passage aux ARA2."
    },
    {
      case: "Prévention du risque infectieux lors d'un sondage urinaire à demeure chez une femme.",
      q: "Quelle est la règle capitale concernant le sac collecteur d'urine ?",
      options: ["Maintenir le sac toujours en position déclive (sous le niveau de la vessie)", "Poser le sac sur le lit à côté de la patiente", "Vider le sac uniquement quand il déborde", "Déconnecter le tuyau toutes les 4 heures pour rincer"],
      correct: 0,
      exp: "Le sac doit toujours être maintenu plus bas que la vessie en système clos pour éviter le reflux d'urine infectée vers les voies urinaires."
    }
  ];

  let selectedQuestions = [];
  let userAnswers = [];
  let currentQIndex = 0;
  let selectedOptionForCurrentQ = null;
  let seconds = 0;
  let timerInterval = null;

  // Algorithme de mélange aléatoire (Fisher-Yates)
  function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function initQuiz() {
    // Sélectionner 20 questions aléatoires
    const shuffled = shuffle(questionBank);
    selectedQuestions = shuffled.slice(0, 20); // Prend les 20 premières après mélange
    userAnswers = new Array(20).fill(null);
    currentQIndex = 0;
    seconds = 0;

    document.getElementById('quizHeader').style.display = 'flex';
    document.getElementById('quizCard').style.display = 'block';
    document.getElementById('correctionSection').style.display = 'none';

    startTimer();
    renderQuestion();
  }

  function startTimer() {
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `⏱ Temps : ${m}:${s}`;
    }, 1000);
  }

  function renderQuestion() {
    const qData = selectedQuestions[currentQIndex];
    document.getElementById('qCount').innerText = `Question ${currentQIndex + 1} sur 20`;
    document.getElementById('caseStudy').innerHTML = `<strong>Cas Clinique :</strong> ${qData.case}`;
    document.getElementById('qText').innerText = qData.q;

    const optsBox = document.getElementById('optionsBox');
    optsBox.innerHTML = "";
    selectedOptionForCurrentQ = userAnswers[currentQIndex];

    qData.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = "option-btn" + (selectedOptionForCurrentQ === idx ? " selected" : "");
      btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
      btn.onclick = () => {
        selectedOptionForCurrentQ = idx;
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      };
      optsBox.appendChild(btn);
    });

    const btnNext = document.getElementById('btnNext');
    btnNext.innerText = (currentQIndex === 19) ? "Terminer le QCM & Voir la correction" : "Suivant →";
  }

  function recordAndNext() {
    if(selectedOptionForCurrentQ === null) {
      alert("Veuillez sélectionner une réponse avant de continuer.");
      return;
    }

    userAnswers[currentQIndex] = selectedOptionForCurrentQ;

    if(currentQIndex < 19) {
      currentQIndex++;
      renderQuestion();
    } else {
      finishQuiz();
    }
  }

  function finishQuiz() {
    clearInterval(timerInterval);
    document.getElementById('quizHeader').style.display = 'none';
    document.getElementById('quizCard').style.display = 'none';

    let score = 0;
    selectedQuestions.forEach((q, idx) => {
      if(userAnswers[idx] === q.correct) score++;
    });

    const pct = Math.round((score / 20) * 100);
    const isPass = pct >= 60;

    const corrSec = document.getElementById('correctionSection');
    corrSec.style.display = 'block';

    let html = `
      <div class="quiz-card" style="text-align:center; margin-bottom:30px;">
        <h2>${isPass ? '🎉 Félicitations ! Module Réussi' : '⚠️ Examen non validé'}</h2>
        <div style="font-size:3.5rem; font-weight:bold; color:${isPass ? '#27ae60' : '#c0392b'}; margin:15px 0;">${pct}%</div>
        <p style="font-size:1.1rem;">Score : <strong>${score} / 20</strong> bonnes réponses.</p>
        <p style="color:#718096; margin-top:5px;">Temps écoulé : ${Math.floor(seconds/60)} min ${seconds%60} sec</p>
        <button class="btn-action" onclick="initQuiz()" style="float:none; margin-top:20px; font-size:1.1rem;">⟳ Générer une nouvelle série de 20 questions</button>
      </div>

      <h3 style="margin-bottom:20px; color:var(--primary);">📋 CORRECTION DÉTAILLÉE DE VOTRE SESSION :</h3>
    `;

    selectedQuestions.forEach((q, idx) => {
      const userAns = userAnswers[idx];
      const isCorrect = userAns === q.correct;

      html += `
        <div class="correction-item ${isCorrect ? 'correct-item' : 'wrong-item'}">
          <div>
            <span class="badge ${isCorrect ? 'badge-success' : 'badge-error'}">
              Question ${idx + 1} : ${isCorrect ? 'CORRECT (+1)' : 'ERREUR (0)'}
            </span>
          </div>
          <p style="font-style:italic; color:#4a5568; margin-bottom:8px;">${q.case}</p>
          <p style="font-weight:bold; margin-bottom:12px;">${q.q}</p>
          
          <p>👉 Votre réponse : <strong style="color:${isCorrect ? '#27ae60' : '#c0392b'};">${String.fromCharCode(65 + userAns)}. ${q.options[userAns]}</strong></p>
          ${!isCorrect ? `<p>✅ Bonne réponse : <strong style="color:#27ae60;">${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}</strong></p>` : ''}
          
          <div class="exp-box">
            <strong>Explication médicale :</strong> ${q.exp}
          </div>
        </div>
      `;
    });

    corrSec.innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Lancement
  initQuiz();
</script>

</body>
</html>
