let currentQuestions = [];

function generateQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';
    document.getElementById('submit-btn').style.display = 'block';
    document.getElementById('restart-btn').style.display = 'none';

    // Tirer 20 questions aléatoires dans les 100
    const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
    currentQuestions = shuffled.slice(0, 20);

    currentQuestions.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'card';
        
        let optionsHTML = '';
        q.options.forEach((opt, oIndex) => {
            optionsHTML += `
                <label id="label-${qIndex}-${oIndex}">
                    <input type="radio" name="question-${qIndex}" value="${oIndex}">
                    ${opt}
                </label>
            `;
        });

        card.innerHTML = `
            <span class="category-badge">${q.category}</span>
            <div class="question-text">${qIndex + 1}. ${q.question}</div>
            <div class="options">${optionsHTML}</div>
            <div id="expl-${qIndex}" class="explanation"></div>
        `;
        container.appendChild(card);
    });
    
    window.scrollTo(0, 0);
}

function checkAnswers() {
    let score = 0;

    currentQuestions.forEach((q, qIndex) => {
        const selected = document.querySelector(`input[name="question-${qIndex}"]:checked`);
        const explDiv = document.getElementById(`expl-${qIndex}`);

        if (selected) {
            const answerVal = parseInt(selected.value);
            if (answerVal === q.answer) {
                score++;
                document.getElementById(`label-${qIndex}-${answerVal}`).style.fontWeight = 'bold';
                document.getElementById(`label-${qIndex}-${answerVal}`).style.color = '#155724';
            } else {
                document.getElementById(`label-${qIndex}-${answerVal}`).style.color = '#721c24';
            }
        }

        const correctLabel = document.getElementById(`label-${qIndex}-${q.answer}`);
        if(correctLabel) {
            correctLabel.style.backgroundColor = '#d4edda';
            correctLabel.style.borderColor = '#c3e6cb';
        }

        explDiv.style.display = 'block';
        explDiv.className = 'explanation correct-bg';
        explDiv.innerHTML = `<strong>Explication :</strong> ${q.explanation}`;
    });

    const container = document.getElementById('quiz-container');
    const scoreBox = document.createElement('div');
    scoreBox.className = 'score-box';
    const noteEnPourcent = Math.round((score / currentQuestions.length) * 100);
    scoreBox.innerHTML = `
        <h3>Résultat de la session</h3>
        <div class="score-val">${score} / ${currentQuestions.length} (${noteEnPourcent}%)</div>
        <p>${noteEnPourcent >= 60 ? "🎉 Félicitations, examen validé !" : "💪 Continue tes révisions, tu vas réussir !"}</p>
    `;
    container.prepend(scoreBox);

    document.getElementById('submit-btn').style.display = 'none';
    document.getElementById('restart-btn').style.display = 'block';
    window.scrollTo(0, 0);
}

// Démarrage automatique
generateQuiz();
</script>
