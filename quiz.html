<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulateur Examen QCM Rishuy</title>
  <style>
    :root {
      --primary: #1b2a47;
      --accent: #0f4c81;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --border: #e2e8f0;
      --success: #27ae60;
      --error: #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 60px; }
    
    header { background: linear-gradient(135deg, #16243d 0%, #1b2a47 100%); color: white; padding: 30px 20px 20px; text-align: center; }
    header h1 { font-size: 2rem; margin-bottom: 6px; }
    header p { opacity: 0.85; margin-bottom: 25px; }

    .main-nav { display: flex; justify-content: center; gap: 10px; background: rgba(255,255,255,0.15); padding: 8px; border-radius: 12px; max-width: 900px; margin: 0 auto; backdrop-filter: blur(5px); }
    .nav-tab { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 8px; color: white; text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.2s; }
    .nav-tab:hover { background: rgba(255,255,255,0.2); }
    .nav-tab.active { background: white; color: #1b2a47; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }

    .container { max-width: 800px; margin: 30px auto 0; padding: 0 20px; }
    
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: white; padding: 12px 20px; border-radius: 8px; border: 1px solid var(--border); }
    .timer { font-weight: bold; color: #e67e22; font-size: 1.1rem; }

    .quiz-card { background: var(--card-bg); border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid var(--border); }
    .case-study { background: #f8fafc; border-left: 4px solid var(--accent); padding: 15px; margin-bottom: 20px; border-radius: 4px; font-style: italic; line-height: 1.5; color: #334155; }
    
    .question-text { font-size: 1.15rem; font-weight: bold; color: var(--primary); margin-bottom: 20px; line-height: 1.4; }

    .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
    .option-btn { padding: 14px 18px; border: 1.5px solid var(--border); border-radius: 8px; background: #fff; text-align: left; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; color: var(--text); line-height: 1.3; }
    .option-btn:hover { background: #f0f4f8; border-color: var(--accent); }
    .option-btn.correct { background: #d4edda !important; border-color: var(--success) !important; color: #155724 !important; font-weight: bold; }
    .option-btn.wrong { background: #f8d7da !important; border-color: var(--error) !important; color: #721c24 !important; }

    .explanation { padding: 18px; background: #eaf2f8; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 0.95rem; border-left: 4px solid var(--accent); line-height: 1.5; }
    
    .btn-next { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; float: right; display: none; font-size: 1rem; }
    .btn-next:hover { background: var(--accent); }

    .score-box { text-align: center; padding: 40px 20px; }
    .score-num { font-size: 3rem; font-weight: bold; color: var(--accent); margin: 15px 0; }

    @media (max-width: 768px) { .main-nav { flex-direction: column; } }
  </style>
</head>
<body>

<header>
  <h1>SIMULATEUR QCM RISHUY</h1>
  <p>Questions à cas cliniques conformes au concours d'infirmier(e) d'État en Israël</p>
  <nav class="main-nav">
    <a href="index.html" class="nav-tab">📄 Fiches de Révision</a>
    <a href="calculatrice.html" class="nav-tab">🧮 Calculette Posologies</a>
    <a href="dictionnaire.html" class="nav-tab">🗣️ Dictionnaire Hébreu</a>
    <a href="quiz.html" class="nav-tab active">🧠 Quiz d'Entraînement</a>
  </nav>
</header>

<div class="container">

  <div class="quiz-header">
    <span id="qCount" style="font-weight: bold; color: var(--primary);">Question 1 sur 5</span>
    <span class="timer" id="timer">⏱ Temps : 00:00</span>
  </div>

  <div class="quiz-card" id="quizCard">
    <div class="case-study" id="caseStudy">
      <strong>Cas Clinique :</strong> Chargement du cas...
    </div>

    <div class="question-text" id="qText">Chargement de la question...</div>

    <div class="options" id="optionsBox"></div>

    <div class="explanation" id="expBox"></div>

    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Question Suivante →</button>
    <div style="clear:both;"></div>
  </div>

</div>

<script>
  const questions = [
    {
      case: "Une patiente de 32 ans, enceinte à 34 SA (semaines d'aménorrhée), arrive aux urgences avec une tension artérielle à 165/110 mmHg, des céphalées sévères, des troubles visuels (scotomes) et des œdèmes importants du visage.",
      q: "Quelle est la priorité infirmière immédiate concernant la prise en charge médicamenteuse médicamenteuse et la sécurité de cette patiente ?",
      options: [
        "Administrer du Paracétamol PO et réévaluer dans 2 heures.",
        "Préparer une perfusion de Sulfate de Magnésium (MgSO4) sous surveillance stricte des réflexes ostéotendineux et de la diurèse.",
        "Mettre la patiente en position assise et administrer un diurétique de l'anse.",
        "Programmer une césarienne d'urgence sans bilan biologique préalable."
      ],
      correct: 1,
      exp: "<strong>Raisonnement médical (Rishuy) :</strong> La patiente présente un tableau de prééclampsie sévère menaçant d'évoluer vers l'éclampsie (convulsions). Le Sulfate de Magnésium (MgSO4) est le traitement neuroprotecteur absolu. La surveillance infirmière obligatoire sous MgSO4 comprend : FR (>12/min), réflexes rotuliens présents, et diurèse (>30 mL/h)."
    },
    {
      case: "Un patient de 65 ans hospitalisé en cardiologie présente soudainement une dyspnée aiguë, une orthopnée stricte, des râles crépitants aux deux champs pulmonaires et des crachats moussourceux rosés.",
      q: "Parmi les actions infirmières suivantes, laquelle devez-vous exécuter en PREMIER ?",
      options: [
        "Allonger le patient à plat à 0° pour favoriser la circulation cérébrale.",
        "Placer le patient en position assise jambes pendantes et administrer de l'oxygène à haut débit.",
        "Administrer immédiatement un bolus de Potassium IV.",
        "Envoyer le patient en radiographie du thorax sans accompagnement."
      ],
      correct: 1,
      exp: "<strong>Raisonnement médical (Rishuy) :</strong> Le patient présente un Œdème Aigu du Poumon (OAP). La position assise jambes pendantes réduit le retour veineux (précharge) et diminue le travail cardiaque. L'oxygénothérapie immédiate lutte contre l'hypoxie."
    },
    {
      case: "Vous préparez une transfusion d'un culot globulaire (PGR) pour un patient hospitalisé. L'unité de sang vient d'arriver de la banque du sang.",
      q: "Selon la réglementation du ministère de la Santé, quelle est l'étape d'identitovigilance obligatoire au lit du patient avant de percuter la poche ?",
      options: [
        "Demander au patient son nom s'il est éveillé et vérifier la concordance des étiquettes et du contrôle ultime ABO (Bedside test) avec un 2ème soignant.",
        "Vérifier uniquement le groupe sanguin écrit sur le dossier médical du patient.",
        "Laisser la poche réchauffer sur le radiateur pendant 45 minutes avant de la poser.",
        "Commencer la perfusion rapidement à un débit de 60 gouttes/min durant les 15 premières minutes."
      ],
      correct: 0,
      exp: "<strong>Raisonnement médical (Rishuy) :</strong> La double vérification concordante de l'identité du patient, du numéro de poche, et le test de compatibilité ABO au lit du patient (carte Beth-Vincent) sont la règle absolue pour prévenir les accidents transfusionnels ABO mortels."
    },
    {
      case: "Un enfant de 4 ans (poids : 16 kg) est admis pour pyrexie à 39.2°C. Le médecin prescrit du Paracétamol sirop (dose pédiatrique standard de 15 mg/kg par prise).",
      q: "Quelle est la dose exacte en milligrammes (mg) à administrer au jeune patient pour cette prise unique ?",
      options: [
        "160 mg",
        "240 mg",
        "400 mg",
        "500 mg"
      ],
      correct: 1,
      exp: "<strong>Calcul de dose :</strong> Dose = Poids × Dosage usuel = 16 kg × 15 mg/kg = 240 mg par prise."
    },
    {
      case: "Selon la loi israélienne sur les droits du patient ('Chok Zkhouyot HaChole'), une intervention médicale ou chirurgicale nécessite le consentement éclairé du patient.",
      q: "Dans quelle situation le consentement éclairé écrit PEUT-IL être outrepassé ou différé légalement ?",
      options: [
        "Lorsque le patient ne parle pas la langue hébraïque.",
        "Si la famille du patient refuse les soins à sa place alors qu'il est majeur et conscient.",
        "En situation d'urgence vitale immédiate où le patient est hors d'état d'exprimer sa volonté.",
        "Pour des raisons d'organisation du service hospitalier."
      ],
      correct: 2,
      exp: "<strong>Législation & Éthique :</strong> En cas d'urgence vitale imminente et d'incapacité du patient à s'exprimer (coma, état de choc sévère), les soins d'urgence nécessaires au maintien de la vie sont dispensés immédiatement sans attendre le consentement écrit préalable."
    }
  ];

  let currentQ = 0;
  let score = 0;
  let seconds = 0;
  let timerInterval;

  function startTimer() {
    timerInterval = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `⏱ Temps : ${m}:${s}`;
    }, 1000);
  }

  function loadQuestion() {
    const qData = questions[currentQ];
    document.getElementById('qCount').innerText = `Question ${currentQ + 1} sur ${questions.length}`;
    document.getElementById('caseStudy').innerHTML = `<strong>Cas Clinique :</strong> ${qData.case}`;
    document.getElementById('qText').innerText = qData.q;
    
    const optsBox = document.getElementById('optionsBox');
    optsBox.innerHTML = "";
    document.getElementById('expBox').style.display = "none";
    document.getElementById('btnNext').style.display = "none";

    qData.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = "option-btn";
      btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
      btn.onclick = () => selectOption(idx, qData.correct, qData.exp);
      optsBox.appendChild(btn);
    });
  }

  function selectOption(selectedIdx, correctIdx, exp) {
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === correctIdx) {
        btn.classList.add('correct');
      } else if (idx === selectedIdx) {
        btn.classList.add('wrong');
      }
    });

    if (selectedIdx === correctIdx) {
      score++;
    }

    const expBox = document.getElementById('expBox');
    expBox.innerHTML = exp;
    expBox.style.display = "block";

    document.getElementById('btnNext').style.display = "block";
  }

  function nextQuestion() {
    currentQ++;
    if (currentQ < questions.length) {
      loadQuestion();
    } else {
      showScore();
    }
  }

  function showScore() {
    clearInterval(timerInterval);
    const pct = Math.round((score / questions.length) * 100);
    const isPass = pct >= 60;

    document.getElementById('quizCard').innerHTML = `
      <div class="score-box">
        <h2>${isPass ? '🎉 Félicitations ! Module Réussi' : '⚠️ Entraînement à Réviser'}</h2>
        <div class="score-num" style="color: ${isPass ? '#27ae60' : '#c0392b'};">${pct}%</div>
        <p>Vous avez répondu correctement à <strong>${score} sur ${questions.length}</strong> questions d'examen.</p>
        <p style="margin-top:10px; color:#718096;">Temps total : ${Math.floor(seconds / 60)} min ${seconds % 60} sec</p>
        <button class="btn-next" onclick="location.reload()" style="display:inline-block; float:none; margin-top:25px;">⟳ Recommencer l'Examen</button>
      </div>
    `;
  }

  // Initialisation
  startTimer();
  loadQuestion();
</script>

</body>
</html>
