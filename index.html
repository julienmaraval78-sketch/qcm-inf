<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préparation Examen de État - Rishuy Infirmier(ère)</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --secondary-color: #f0fdf4;
            --accent-color: #16a34a;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #0369a1;
            padding: 0.5rem;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            margin: 0 0.25rem;
            border-radius: 4px;
            transition: background 0.2s;
        }
        nav a:hover {
            background-color: #0284c7;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .question-box {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .options-list {
            list-style: none;
            padding: 0;
        }
        .options-list li {
            background: #f1f5f9;
            margin-bottom: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
            border: 2px solid transparent;
        }
        .options-list li:hover {
            background: #e2e8f0;
        }
        .options-list li.correct {
            background: #dcfce7;
            border-color: var(--accent-color);
            color: #166534;
        }
        .options-list li.incorrect {
            background: #fee2e2;
            border-color: #dc2626;
            color: #991b1b;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 1.5rem;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        #result-container {
            margin-top: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Révisions Rishuy - Infirmier(ère)</h1>
        <p>Entraînement interactif aux examens d'État</p>
    </header>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="dictionnaire.html">Dictionnaire[cite: 8]</a>
        <a href="normes.html">Flash-Analyse / Normes[cite: 9]</a>
        <a href="qcm.html">Simulateur QCM[cite: 10]</a>
        <a href="calculette.html">Calculette[cite: 11]</a>
    </nav>

    <div class="container">
        <div id="quiz-container">
            <div class="question-box" id="question-text">Chargement de la question...</div>
            <ul class="options-list" id="options-list">
                <!-- Les options seront injectées ici -->
            </ul>
            <button class="btn" id="next-btn" onclick="nextQuestion()" style="display:none;">Question suivante</button>
            <div id="result-container"></div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Quel est le principal rôle infirmier face à un patient sous traitement anticoagulant oral (AVK) ?",
                options: [
                    "Surveiller uniquement la tension artérielle",
                    "Surveiller l'apparition de signes hémorragiques et contrôler le taux d'INR",
                    "Interdire totalement la consommation de légumes verts",
                    "Administrer le traitement en injection intramusculaire exclusive"
                ],
                correct: 1
            },
            {
                question: "Quelle est la valeur normale standard du taux de potassium (kalémie) chez l'adulte ?",
                options: [
                    "1.5 à 3.0 mmol/L",
                    "3.5 à 5.0 mmol/L",
                    "5.5 à 7.0 mmol/L",
                    "10 à 14 mmol/L"
                ],
                correct: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const currentQ = quizData[currentQuestionIndex];
            document.getElementById("question-text").innerText = `Question ${currentQuestionIndex + 1} / ${quizData.length} : ${currentQ.question}`;
            
            const optionsList = document.getElementById("options-list");
            optionsList.innerHTML = "";
            
            currentQ.options.forEach((option, index) => {
                const li = document.createElement("li");
                li.innerText = option;
                li.onclick = () => selectOption(li, index);
                optionsList.appendChild(li);
            });

            document.getElementById("next-btn").style.display = "none";
            document.getElementById("result-container").innerText = "";
        }

        function selectOption(liElement, index) {
            if (answered) return;
            answered = true;
            
            const currentQ = quizData[currentQuestionIndex];
            const options = document.querySelectorAll(".options-list li");

            if (index === currentQ.correct) {
                liElement.classList.add("correct");
                score++;
                document.getElementById("result-container").innerText = "Bonne réponse !";
                document.getElementById("result-container").style.color = "var(--accent-color)";
            } else {
                liElement.classList.add("incorrect");
                options[currentQ.correct].classList.add("correct");
                document.getElementById("result-container").innerText = "Mauvaise réponse.";
                document.getElementById("result-container").style.color = "#dc2626";
            }

            if (currentQuestionIndex < quizData.length - 1) {
                document.getElementById("next-btn").style.display = "block";
            } else {
                document.getElementById("next-btn").style.display = "block";
                document.getElementById("next-btn").innerText = "Voir le score final";
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showFinalScore();
            }
        }

        function showFinalScore() {
            const container = document.getElementById("quiz-container");
            container.innerHTML = `
                <h2>Quiz terminé !</h2>
                <p>Votre score est de <strong>${score} / ${quizData.length}</strong></p>
                <button class="btn" onclick="restartQuiz()">Recommencer</button>
            `;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            location.reload();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
